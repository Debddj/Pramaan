version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pramaan-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./pramaan.db
      - TRIAGE_CONFIDENCE_THRESHOLD=0.85
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    restart: unless-stopped

  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: pramaan-dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
